<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotarr</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The theme: the one chosen with the header's button (saved in this
      // browser), or the system's. Applied before the page draws, so it never
      // flashes, and again when the system switches. The button calls
      // window.applyTheme after saving a new choice.
      const systemDark = matchMedia("(prefers-color-scheme: dark)");
      window.applyTheme = () => {
        let choice = "system";
        try {
          choice = localStorage.getItem("theme") || "system";
        } catch {}
        const dark = choice === "dark" || (choice === "system" && systemDark.matches);
        document.documentElement.classList.toggle("dark", dark);
      };
      window.applyTheme();
      systemDark.addEventListener("change", window.applyTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
