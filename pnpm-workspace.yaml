packages:
  - apps/*
  - packages/*

# pnpm refuses dependencies' postinstall scripts unless approved here. buf's script links the platform binary.
allowBuilds:
  "@bufbuild/buf": true
  esbuild: true

minimumReleaseAgeExclude:
  - zod@4.6.6
  - "@tanstack/query-core@5.104.2"
  - "@tanstack/react-query@5.104.2"

