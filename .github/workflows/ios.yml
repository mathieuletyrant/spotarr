name: iOS

# Only when the app or what it is generated from changes.
on:
  pull_request:
    paths: ["apps/ios/**", "packages/contract/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["apps/ios/**", "packages/contract/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      # Version.xcconfig and the server's package.json are bumped together by release-please.
      - name: The app's version is the server's
        run: |
          app=$(xcodebuild -showBuildSettings -project apps/ios/Spotarr.xcodeproj -scheme Spotarr | awk '$1 == "MARKETING_VERSION" { print $3; exit }')
          server=$(jq -r .version apps/server/package.json)
          echo "app $app, server $server"
          test "$app" = "$server"
      # SpotarrKit's tests run on the Mac: the client, the settings, the link finder.
      - run: swift test --package-path apps/ios/SpotarrKit
      # The app and its share extension, unsigned, for the simulator.
      - run: >
          xcodebuild build
          -project apps/ios/Spotarr.xcodeproj
          -scheme Spotarr
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
