syntax = "proto3";

package spotarr.v1;

import "google/protobuf/timestamp.proto";

service SpotarrService {
  // The web UI's sign-in: checks the API token and keeps it in an HttpOnly cookie.
  // The only RPC callable without the token.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Signs the web UI out: clears the cookie Login set.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Spotarr's version. Cheap: the web UI also calls it to check the sign-in.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Calls each Dependency (LLM, TMDB, Seerr, yt-dlp, ffmpeg) and says whether it
  // works, with the reason when it does not. Takes a few seconds.
  rpc CheckDependencies(CheckDependenciesRequest) returns (CheckDependenciesResponse);
  // What Spotarr did, month by month, since the first Share.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  // Every setting, secrets included: this is a single-user app and the UI shows them.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Changes only the fields that are present; returns the settings as saved.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // Replaces the MCP token with a new one: the old one stops working at once.
  rpc RegenerateMcpToken(RegenerateMcpTokenRequest) returns (RegenerateMcpTokenResponse);
  // Replaces the Seerr token with a new one: Seerr is refused until it gets it.
  rpc RegenerateSeerrToken(RegenerateSeerrTokenRequest) returns (RegenerateSeerrTokenResponse);

  // Records a Share and queues its Identification. Answers at once, status QUEUED.
  rpc CreateShare(CreateShareRequest) returns (CreateShareResponse);
  rpc GetShare(GetShareRequest) returns (GetShareResponse);
  // Newest first, paginated, filterable by Summary and by text.
  rpc ListShares(ListSharesRequest) returns (ListSharesResponse);
  // Resets a finished Identification and queues it again, with another effort
  // or a hint if asked. Additions are kept.
  rpc RetryIdentification(RetryIdentificationRequest) returns (RetryIdentificationResponse);
  // Adds one Candidate of a Share to the library. The Share comes back with the new Addition,
  // whose status says what happened: requested, already present, or failed (with the reason).
  rpc Add(AddRequest) returns (AddResponse);
  // Deletes a Share from Spotarr with its Candidates, Additions and frames. What
  // was requested in Seerr stays there. Refused (busy) while its Identification runs.
  rpc DeleteShare(DeleteShareRequest) returns (DeleteShareResponse);

  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  // Creates the Webhook when its id is empty, else replaces it.
  rpc SaveWebhook(SaveWebhookRequest) returns (SaveWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  // Sends a sample "test" event to one Webhook; returns it with that delivery.
  rpc TestWebhook(TestWebhookRequest) returns (TestWebhookResponse);

  // Auto add's Rules, oldest first. A Candidate is requested, or put in Seerr's
  // watchlist, without a click when one enabled Rule holds for it. A Rule that
  // requests wins over one that puts in the watchlist; among the same action,
  // the first Rule that holds is credited.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  // Creates the Rule when its id is empty, else replaces it.
  rpc SaveRule(SaveRuleRequest) returns (SaveRuleResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  // What these Rules would have added over the recent history. Adds nothing:
  // the Rule being edited is checked before it is saved.
  rpc PreviewRules(PreviewRulesRequest) returns (PreviewRulesResponse);

  // The streaming Platforms TMDB knows in the chosen country, to choose the
  // ones subscribed to, and the countries to choose from (Settings → streaming).
  rpc ListPlatforms(ListPlatformsRequest) returns (ListPlatformsResponse);
  // Where a title can be watched now: each chosen Platform that streams it,
  // and the library when the title is there. Asked live, never stored.
  rpc ListWatchLinks(ListWatchLinksRequest) returns (ListWatchLinksResponse);
}

message CheckDependenciesRequest {}

message CheckDependenciesResponse {
  repeated Dependency dependencies = 1;
  // No longer sent: GetStats gives the LLM cost month by month.
  optional LlmCost llm_cost = 2 [deprecated = true];
}

message Dependency {
  // "LLM", "TMDB", "Seerr", "yt-dlp" or "ffmpeg".
  string name = 1;
  DependencyState state = 2;
  // What was checked, or why it failed: "google/gemini-3.8-flash", "Seerr answered 401".
  string detail = 3;
}

enum DependencyState {
  DEPENDENCY_STATE_UNSPECIFIED = 0;
  DEPENDENCY_STATE_OK = 1;
  // A setting it needs is empty, e.g. no API key.
  DEPENDENCY_STATE_NOT_CONFIGURED = 2;
  DEPENDENCY_STATE_ERROR = 3;
}

message LlmCost {
  // How many Identifications the total covers.
  int32 identifications = 1;
  double total_usd = 2;
}

message GetStatsRequest {}

message GetStatsResponse {
  // Every month with at least one Share or Addition, oldest first. Months are
  // in UTC, like the dates Spotarr stores.
  repeated MonthStats months = 1;
  // Where the Shares come from, most Shares first.
  repeated SourceStats sources = 2;
  // Additions that did not fail, by type.
  int32 movies_added = 3;
  int32 shows_added = 4;
  // The last titles added, newest first.
  repeated AddedTitle recently_added = 5;
  // The accounts whose videos are shared the most, most Shares first.
  repeated AuthorStats authors = 6;
}

message AuthorStats {
  // As the video's site shows it: "Marion ciné 🎬".
  string author = 1;
  // Where the account posts: "instagram.com".
  string source = 2;
  int32 shares = 3;
  // Of those Shares, how many found at least one Candidate.
  int32 identified = 4;
}

message AddedTitle {
  // The Share it was added from.
  string share_id = 1;
  MediaType type = 2;
  string title = 3;
  optional int32 year = 4;
  optional string poster_url = 5;
  // Made by auto add, without a click.
  bool automatic = 6;
}

message MonthStats {
  // "2026-10".
  string month = 1;
  int32 shares = 2;
  // Shares whose Identification found at least one Candidate.
  int32 identified = 3;
  int32 no_match = 4;
  int32 failed = 5;
  // Additions that did not fail, made that month, and how many of them auto add made.
  int32 additions = 6;
  int32 automatic_additions = 7;
  // What the LLM cost for that month's Shares, when its provider reports it.
  double llm_cost_usd = 8;
}

message SourceStats {
  // "instagram.com", "tiktok.com", "text"…
  string source = 1;
  int32 shares = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  // Spotarr's own version, from the Docker image tag.
  string version = 1;
}

// Every field is optional: in UpdateSettings an absent field means "leave unchanged".
// GetSettings always fills them all.
message Settings {
  IdentificationSettings identification = 1;
  SeerrSettings seerr = 2;
  ExtractionSettings extraction = 3;
  AccessSettings access = 4;
  WebhookSettings webhooks = 5;
  // Replaced by the Rules (ListRules, SaveRule): the old settings became the first Rule.
  AutoAddSettings auto_add = 6 [deprecated = true];
  StreamingSettings streaming = 7;
}

message StreamingSettings {
  // TMDB ids of the Platforms subscribed to (Crunchyroll is 283). In
  // UpdateSettings, a `streaming` present replaces the whole list: empty
  // clears it. Send it again with `country`.
  repeated int32 platform_ids = 1;
  // The country whose catalogues count, e.g. "FR". Empty: the country of the
  // TMDB language (fr-FR → FR).
  optional string country = 2;
}

// Replaced by the Rules.
message AutoAddSettings {
  optional bool enabled = 1;
  // Percent, 50 to 100.
  optional int32 min_confidence = 2;
  // True: only when the Identification found a single Candidate, and it reaches
  // min_confidence. False: every Candidate that reaches it.
  optional bool only_one = 3;
}

message WebhookSettings {
  // Where the web UI answers, e.g. "https://spotarr.example.com": events then
  // link to the Share's page. Empty: no link.
  optional string web_ui_url = 1;
}

message IdentificationSettings {
  // Any OpenAI-compatible API; OpenRouter by default.
  optional string llm_api_url = 1;
  optional string llm_api_key = 2;
  // Replaced by `model`.
  optional string text_model = 3 [deprecated = true];
  // Replaced by `model`.
  optional string image_model = 4 [deprecated = true];
  // No longer used: the LLM always gets a strict JSON schema (structured outputs).
  optional bool force_json = 5 [deprecated = true];
  // TMDB read access token.
  optional string tmdb_token = 6;
  // Language of TMDB titles and overviews, e.g. "fr-FR".
  optional string language = 7;
  // The LLM model; it must read images and hear audio, since it gets the
  // video's frames and sound (Gemini does).
  optional string model = 8;
  // How long the LLM thinks before answering: "low", "medium" or "high".
  // Higher is slower and dearer, and may find what a quick look misses.
  optional string effort = 9;
}

message SeerrSettings {
  optional string url = 1;
  optional string api_key = 2;
}

message ExtractionSettings {
  // Removed: public reels need no account. Back if private reels ever matter.
  optional string cookies_txt = 1 [deprecated = true];
  // 1 to 15.
  optional int32 frames_per_video = 2;
  optional int32 max_video_mb = 3;
  // How many Identifications run at the same time.
  optional int32 concurrency = 4;
}

message AccessSettings {
  // Generated at first start. Read-only: ignored by UpdateSettings.
  optional string api_token = 1;
  // Removed: checking the Cloudflare Access JWT is decided at deployment.
  optional string public_hostname = 2 [deprecated = true];
  // Removed, see public_hostname.
  optional string team_domain = 3 [deprecated = true];
  // Removed, see public_hostname.
  optional string aud = 4 [deprecated = true];
  // Read-only access for MCP clients, at /mcp?token=<mcp_token>.
  // Generated at first start, changed by RegenerateMcpToken only: ignored by
  // UpdateSettings. It calls nothing but /mcp; the API refuses it.
  optional string mcp_token = 5;
  // What Seerr sends in the Authorization header when it reports a change, at
  // /seerr/webhook. Generated at first start, changed by RegenerateSeerrToken
  // only: ignored by UpdateSettings. Refused anywhere else.
  optional string seerr_token = 6;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  Settings settings = 1;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}

message RegenerateMcpTokenRequest {}

message RegenerateMcpTokenResponse {
  string mcp_token = 1;
}

message RegenerateSeerrTokenRequest {}

message RegenerateSeerrTokenResponse {
  string seerr_token = 1;
}

message ListPlatformsRequest {}

message ListPlatformsResponse {
  // In the order TMDB shows them in that country, most watched first.
  repeated Platform platforms = 1;
  // The country they are from: the chosen one, else the TMDB language's
  // ("FR" for fr-FR).
  string region = 2;
  // Every country TMDB knows Platforms in, by name.
  repeated Country countries = 3;
}

message Country {
  // ISO 3166-1: "FR".
  string code = 1;
  // In the TMDB language: "Japon".
  string name = 2;
}

// A streaming service, as TMDB (with JustWatch's data) knows it.
message Platform {
  // TMDB's provider id.
  int32 id = 1;
  string name = 2;
  optional string logo_url = 3;
}

message ListWatchLinksRequest {
  int32 tmdb_id = 1;
  MediaType type = 2;
}

message ListWatchLinksResponse {
  // The library first, then the Platforms in TMDB's order. Empty when the
  // title is on none of them.
  repeated WatchLink links = 1;
}

message WatchLink {
  // "Crunchyroll", or the library's server: "Jellyfin", "Plex".
  string name = 1;
  // A Platform's link is TMDB's page of where to watch the title, in the
  // settings' country: TMDB gives no link to the Platform itself. The
  // library's is the title's page on its server, from Seerr.
  string url = 2;
  optional string logo_url = 3;
}

// A piece of content sent to Spotarr and everything that follows from it.
message Share {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  ShareInput input = 3;
  // Domain of the URL ("instagram.com"), or "image" / "text".
  string source = 4;
  Identification identification = 5;
  repeated Candidate candidates = 6;
  repeated Addition additions = 7;
  // What the history shows. Derived, never stored.
  Summary summary = 8;
  // Thumbnails of the shared video, in order.
  repeated Frame frames = 9;
  // Why the Share failed, when its summary is FAILED: the latest Addition's
  // error, else the Identification's.
  optional string failure_reason = 10;
  // Candidates whose latest Addition put them in the library or found them
  // there already. Never more than the Candidates.
  int32 added_count = 11;
}

// A thumbnail taken from the shared video, 240 px wide.
message Frame {
  // When, in the video.
  float at_seconds = 1;
  // Where to get the JPEG, on the same origin: /frames/<share id>/<n>.jpg.
  // Needs the API token, like the API.
  string url = 2;
}

message ShareInput {
  optional string url = 1;
  optional string text = 2;
  // The image itself is never sent back.
  bool has_image = 3;
}

message Identification {
  IdentificationStatus status = 1;
  Method method = 2;
  optional int32 duration_ms = 3;
  // Which extractors succeeded, e.g. "web", "video".
  repeated string extractors = 4;
  Clues clues = 5;
  optional string reasoning = 6;
  // Set when status is FAILED.
  optional string error = 7;
  // The effort the LLM got ("low", "medium", "high"), when method is LLM.
  optional string effort = 8;
  // The hint given with the Retry that started this Identification.
  optional string hint = 9;
}

message Clues {
  optional string caption = 1;
  optional string author = 2;
  optional string subtitles = 3;
}

message Candidate {
  int32 tmdb_id = 1;
  MediaType type = 2;
  string title = 3;
  optional string original_title = 4;
  optional int32 year = 5;
  optional string poster_url = 6;
  // 0 to 1. Absent for a direct ID, which is certain.
  optional float confidence = 7;
  LibraryState library_state = 8;
  // TMDB's users' average, out of 10, and how many votes it rests on.
  // Absent when nobody rated it, and on Shares identified before ratings were
  // kept, until Spotarr fills them at its next start.
  optional float tmdb_rating = 9;
  optional int32 tmdb_votes = 10;
  // Where the Candidate stands. Derived, never stored.
  CandidateStatus status = 11;
  // REQUESTED or ADDED by auto add, without a click.
  bool automatic = 12;
  // CAN_ADD after a failed Addition: its error, to show next to "Try again".
  optional string failure = 13;
  // TMDB's genres, in the settings' language: "Science-Fiction", "Drame".
  // Empty when unknown, as on a Share identified before genres were kept,
  // until Spotarr fills them at its next start.
  repeated string genres = 14;
  // REQUESTED or ADDED by auto add: the name of the Rule that did it.
  optional string rule = 15;
  // TMDB's synopsis, in the settings' language. Absent when TMDB has none in
  // it, and on Shares identified before overviews were kept, until Spotarr
  // fills them at its next start.
  optional string overview = 16;
}

message Addition {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  int32 tmdb_id = 3;
  MediaType type = 4;
  Target target = 5;
  AdditionStatus status = 6;
  optional string error = 7;
  // Made by auto add, without a click.
  bool automatic = 8;
  // The name of the Rule that made it, as it was then. Absent for a click.
  optional string rule = 9;
}

enum IdentificationStatus {
  IDENTIFICATION_STATUS_UNSPECIFIED = 0;
  IDENTIFICATION_STATUS_QUEUED = 1;
  IDENTIFICATION_STATUS_PROCESSING = 2;
  IDENTIFICATION_STATUS_READY = 3;
  IDENTIFICATION_STATUS_NO_MATCH = 4;
  IDENTIFICATION_STATUS_FAILED = 5;
}

enum Method {
  METHOD_UNSPECIFIED = 0;
  // An IMDb or TMDB ID was found in the clues; no LLM involved.
  METHOD_DIRECT_ID = 1;
  METHOD_LLM = 2;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_TV = 2;
}

enum LibraryState {
  LIBRARY_STATE_UNSPECIFIED = 0;
  LIBRARY_STATE_ABSENT = 1;
  LIBRARY_STATE_REQUESTED = 2;
  // Some seasons only.
  LIBRARY_STATE_PARTIAL = 3;
  LIBRARY_STATE_AVAILABLE = 4;
}

enum Target {
  TARGET_UNSPECIFIED = 0;
  // Radarr or Sonarr directly. Not in V1.
  TARGET_ARR = 1;
  TARGET_SEERR = 2;
}

enum AdditionStatus {
  ADDITION_STATUS_UNSPECIFIED = 0;
  ADDITION_STATUS_ADDED = 1;
  ADDITION_STATUS_REQUESTED = 2;
  ADDITION_STATUS_ALREADY_PRESENT = 3;
  ADDITION_STATUS_FAILED = 4;
}

// From its Library state, whatever path led there. Seerr keeps it current.
enum CandidateStatus {
  CANDIDATE_STATUS_UNSPECIFIED = 0;
  CANDIDATE_STATUS_CAN_ADD = 1;
  CANDIDATE_STATUS_REQUESTED = 2;
  // Not used: a title in the library is ALREADY_PRESENT, however it got there.
  CANDIDATE_STATUS_ADDED = 3;
  // In the library ("Available"), whether it was there before or came through Spotarr.
  CANDIDATE_STATUS_ALREADY_PRESENT = 4;
}

enum Summary {
  SUMMARY_UNSPECIFIED = 0;
  SUMMARY_IN_PROGRESS = 1;
  SUMMARY_TO_CHOOSE = 2;
  // Not used, see CANDIDATE_STATUS_ADDED.
  SUMMARY_ADDED = 3;
  SUMMARY_REQUESTED = 4;
  // In the library ("Available").
  SUMMARY_ALREADY_PRESENT = 5;
  SUMMARY_NO_MATCH = 6;
  SUMMARY_FAILED = 7;
}

message CreateShareRequest {
  optional string url = 1;
  optional string text = 2;
  // 4 MB at most.
  optional bytes image = 3;
}

message CreateShareResponse {
  Share share = 1;
}

message GetShareRequest {
  string id = 1;
}

message GetShareResponse {
  Share share = 1;
}

message ListSharesRequest {
  // 50 when absent, 100 at most.
  optional int32 page_size = 1;
  // next_cursor of the previous page.
  optional string cursor = 2;
  // Only these summaries; all when empty.
  repeated Summary summaries = 3;
  // Matches the source, the URL, the text, the candidates' titles and genres.
  optional string query = 4;
  // Only the Shares with a Candidate of one of these genres ("Horreur");
  // all when empty.
  repeated string genres = 5;
}

message ListSharesResponse {
  repeated Share shares = 1;
  // Absent on the last page.
  optional string next_cursor = 2;
  // How many Shares the whole history has, in total and per Summary, whatever
  // the filters: the counts of the history's filter buttons.
  int32 total = 3;
  repeated SummaryCount counts = 4;
  // Every genre of the whole history's Candidates, with how many Shares have
  // it, most Shares first, whatever the filters: the history's genre filter.
  repeated GenreCount genres = 5;
}

message GenreCount {
  string genre = 1;
  // Shares with at least one Candidate of this genre.
  int32 count = 2;
}

message SummaryCount {
  Summary summary = 1;
  int32 count = 2;
}

message RetryIdentificationRequest {
  string id = 1;
  // "low", "medium" or "high" for this Identification only; the setting's when absent.
  optional string effort = 2;
  // One sentence for the LLM, for this Identification only: "the Korean show,
  // not the movie". 500 characters at most.
  optional string hint = 3;
}

message RetryIdentificationResponse {
  Share share = 1;
}

message AddRequest {
  string share_id = 1;
  int32 tmdb_id = 2;
  MediaType type = 3;
  // Seerr when unspecified; V1 supports Seerr only.
  Target target = 4;
}

message AddResponse {
  Share share = 1;
}

message DeleteShareRequest {
  string id = 1;
}

message DeleteShareResponse {}

message LoginRequest {
  string token = 1;
}

message LoginResponse {}

message LogoutRequest {}

message LogoutResponse {}

// Spotarr POSTs this, as JSON, to every Webhook that chose the event.
message WebhookEvent {
  // "identification.ready", "identification.no_match", "identification.failed",
  // "media.added", or "test" for TestWebhook.
  string event = 1;
  string share_id = 2;
  // When the Share was received.
  google.protobuf.Timestamp created_at = 3;
  // The Share's page in the web UI. Absent without a web UI address in the settings.
  optional string share_url = 4;
  // e.g. "instagram.com"
  string source = 5;
  // What was shared, when it was a link.
  optional string shared_url = 6;
  // Best first.
  repeated Candidate candidates = 7;
  // identification.failed: why.
  optional string error = 8;
  // media.added: the Candidate that was added.
  optional Candidate added = 9;
}

message Webhook {
  // Empty in SaveWebhook to create one.
  string id = 1;
  string url = 2;
  // The events it receives, as in WebhookEvent.event (never "test").
  repeated string events = 3;
  // Optional. When set, the X-Spotarr-Signature header carries the body's
  // HMAC-SHA256 with this secret, in hex.
  string secret = 4;
  // Read-only: the last time Spotarr called it.
  optional WebhookDelivery last_delivery = 5;
}

message WebhookDelivery {
  google.protobuf.Timestamp at = 1;
  string event = 2;
  bool ok = 3;
  // "HTTP 200", or why it failed.
  string detail = 4;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message SaveWebhookRequest {
  Webhook webhook = 1;
}

message SaveWebhookResponse {
  Webhook webhook = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message TestWebhookRequest {
  string id = 1;
}

message TestWebhookResponse {
  Webhook webhook = 1;
}

// When auto add requests a Candidate, or puts it in Seerr's watchlist, without
// a click. All its conditions must hold; an absent condition is no condition.
message Rule {
  // Empty in SaveRule to create one.
  string id = 1;
  // "Safe movies": shown on the Share's page next to what the Rule added.
  string name = 2;
  bool enabled = 3;
  // Only movies, or only TV shows. UNSPECIFIED: both.
  MediaType type = 4;
  // Only when the Identification found a single Candidate in total.
  bool only_one = 5;
  // Percent, 1 to 100. A direct IMDb/TMDB link counts as 100.
  optional int32 min_confidence = 6;
  // TMDB rating, out of 10. A Candidate nobody rated fails it, unless
  // unreleased_skips_rating lets a title not out yet through.
  optional float min_rating = 7;
  // How many TMDB votes the rating rests on, at least.
  optional int32 min_votes = 8;
  // A title not out yet (released after today, or with no date on TMDB) has
  // no rating to judge: it skips min_rating and min_votes, not the others.
  bool unreleased_skips_rating = 9;
  // What it does with the Candidates it holds for. UNSPECIFIED: SEERR_REQUEST.
  RuleAction action = 10;
}

// Each Action belongs to one connection: Radarr and Sonarr, when they come,
// bring their own (they have no watchlist).
enum RuleAction {
  RULE_ACTION_UNSPECIFIED = 0;
  // Through Seerr, which sends it to Radarr or Sonarr.
  RULE_ACTION_SEERR_REQUEST = 1;
  // In the watchlist of Seerr's owner: nothing is requested, and JellyTV shows
  // it. It leaves the watchlist once available.
  RULE_ACTION_SEERR_WATCHLIST = 2;
}

message ListRulesRequest {}

message ListRulesResponse {
  repeated Rule rules = 1;
}

message SaveRuleRequest {
  Rule rule = 1;
}

message SaveRuleResponse {
  Rule rule = 1;
}

message DeleteRuleRequest {
  string id = 1;
}

message DeleteRuleResponse {}

message PreviewRulesRequest {
  // The Rules to try, saved or not; their enabled switch counts.
  repeated Rule rules = 1;
}

message PreviewRulesResponse {
  // How many of the latest identified Shares were looked at.
  int32 shares = 1;
  // What the Rules would have requested, newest Share first.
  repeated PreviewedAddition additions = 2;
}

message PreviewedAddition {
  string share_id = 1;
  string title = 2;
  optional int32 year = 3;
  MediaType type = 4;
  optional string poster_url = 5;
  // The name of the Rule credited for it.
  string rule = 6;
  RuleAction action = 7;
}
